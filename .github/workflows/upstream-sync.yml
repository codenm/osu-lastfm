name: Check upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/yaGeey/osu-find-songs.git

      - name: Fetch remotes
        run: |
          git fetch origin
          git fetch upstream

      - name: Check for upstream changes
        run: |
          COMMITS_AHEAD="$(git rev-list --count origin/main..upstream/main)"

          if [ "$COMMITS_AHEAD" = "0" ]; then
            echo "No upstream changes found."
            echo "## Upstream check" >> "$GITHUB_STEP_SUMMARY"
            echo "origin/main already contains upstream/main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Upstream has ${COMMITS_AHEAD} new commit(s). Manual review is required."
          echo "## Upstream check" >> "$GITHUB_STEP_SUMMARY"
          echo "upstream/main has ${COMMITS_AHEAD} new commit(s) that are not in origin/main." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review manually before syncing, because this fork intentionally diverges from upstream." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested local commands:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`powershell" >> "$GITHUB_STEP_SUMMARY"
          echo "git fetch upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "git log --oneline origin/main..upstream/main" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
